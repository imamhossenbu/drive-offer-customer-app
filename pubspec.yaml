name: drive_offer_customer_app
description: "Alokito Telecom - Customer Mobile App (Drive Offers, Instant Recharge & Wallet)"
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.0
  provider: ^6.1.2
  intl: ^0.19.0
  audioplayers: ^6.1.0
  image_picker: ^1.2.3
  http_parser: ^4.0.2
  google_fonts: ^6.2.0
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  ota_update: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
    - assets/operators/
    - assets/payments/
  fonts:
    - family: Bornomala
      fonts:
        - asset: assets/fonts/Bornomala-Regular.ttf
        - asset: assets/fonts/Bornomala-Bold.ttf
          weight: 700
